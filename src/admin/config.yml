backend:
  name: git-gateway
  branch: main

media_folder: "src/static/uploads"
public_folder: "/static/uploads"


collections:
  - name: "pages"
    label: "Stránky"
    folder: "content/pages"
    create: true
    fields:
      - { label: "Název stránky (interní)", name: "title", widget: "string" }
      - label: "Obsah stránky"
        name: "sections"
        widget: "list"
        types:
          - label: "Standardní text"
            name: "default_section"
            fields:
              - { label: "Text", name: "body", widget: "markdown" }
          - label: "Kontaktní formulář"
            name: "contact_section"
            fields:
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Telefon", name: "phone", widget: "string" }