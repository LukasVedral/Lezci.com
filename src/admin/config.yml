backend:
  name: git-gateway
  branch: main

media_folder: "src/static/uploads"
public_folder: "/static/uploads"


collections:
  - name: "pages"
    label: "Stránky"
    folder: "content/pages"
    create: true
    slug: "{{slug}}"
    fields:
      # 1. Výběr šablony (tento prvek ovládá zbytek formuláře)
      - label: "Šablona stránky"
        name: "layout"
        widget: "select"
        options:
          - { label: "Standardní text", value: "default" }
          - { label: "Kontaktní formulář", value: "contact" }
          - { label: "Detail služby", value: "service" }
        default: "default"

      # 2. Společné pole (zobrazí se vždy)
      - { label: "Titulek stránky", name: "title", widget: "string" }

      # --- POLE PRO ŠABLONU: STANDARDNÍ TEXT ---
      - label: "Hlavní text (Markdown)"
        name: "body"
        widget: "markdown"
        condition: { field: "layout", value: "default" }

      # --- POLE PRO ŠABLONU: KONTAKT ---
      - label: "Kontaktní email"
        name: "email"
        widget: "string"
        required: false
        condition: { field: "layout", value: "contact" }

      - label: "Telefon"
        name: "phone"
        widget: "string"
        required: false
        condition: { field: "layout", value: "contact" }

      - label: "Adresa pobočky"
        name: "address"
        widget: "text"
        required: false
        condition: { field: "layout", value: "contact" }

      # --- POLE PRO ŠABLONU: DETAIL SLUŽBY ---
      - label: "Cena služby"
        name: "price"
        widget: "string"
        required: false
        condition: { field: "layout", value: "service" }

      - label: "Popis služby"
        name: "service_description"
        widget: "markdown"
        required: false
        condition: { field: "layout", value: "service" }