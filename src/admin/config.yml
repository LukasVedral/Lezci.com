backend:
  name: git-gateway
  branch: main

media_folder: "src/static/uploads"
public_folder: "/static/uploads"


collections:
  - name: "pages"
    label: "Stránky"
    folder: "content/pages" # Složka, kam se ukládají .md soubory
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titulek", name: "title", widget: "string" }
      
      # TADY JE TEN VÝBĚR ŠABLONY:
      - label: "Šablona stránky"
        name: "layout"
        widget: "select"
        options:
          - { label: "Standardní text", value: "default" }
          - { label: "Kontaktní formulář", value: "contact" }
          - { label: "Detail služby", value: "service" }
        default: "default"

      # Pole, které se zobrazí vždy
      - { label: "Hlavní text", name: "body", widget: "markdown" }

      # Podmíněná pole (volitelné):
      # Pokud chceš, aby se některá pole ukázala jen pro určitou šablonu,
      # můžeš použít 'condition' (vyžaduje novější verze Decap CMS)
      - label: "Telefon pro kontakt"
        name: "phone"
        widget: "string"
        required: false
        # Toto pole admin vyplní jen u šablony 'contact'