backend:
  name: git-gateway
  branch: main

media_folder: "src/static/uploads"
public_folder: "/static/uploads"



collections:

  - name: "standard_pages"
    label: "Standardní stránky"
    folder: "content/pages/standard" # Vlastní složka
    create: true
    fields:
      - { label: "Titulek", name: "title", widget: "string" }
      - { label: "Text", name: "body", widget: "markdown" }



  - name: "contact_pages"
    label: "Kontaktní stránky"
    folder: "content/pages/contacts" # Jiná složka
    create: true
    fields:
      - { label: "Titulek", name: "title", widget: "string" }
      - { label: "Email", name: "email", widget: "string" }
      - { label: "Telefon", name: "phone", widget: "string" }