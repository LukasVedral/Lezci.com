backend:
  name: git-gateway
  branch: main

media_folder: "src/static/uploads"
public_folder: "/static/uploads"


collections:
  - name: "pages"
    label: "Stránky"
    folder: "content/pages"
    create: true
    slug: "{{slug}}"
    # Místo 'fields' použijeme 'types'
    types:
      - label: "Standardní text"
        name: "default"
        fields:
          - { label: "Titulek", name: "title", widget: "string" }
          - { label: "Hlavní text", name: "body", widget: "markdown" }

      - label: "Kontaktní formulář"
        name: "contact"
        fields:
          - { label: "Titulek", name: "title", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Telefon", name: "phone", widget: "string" }
          - { label: "Jméno", name: "contact_name", widget: "string" }

      - label: "Detail služby"
        name: "service"
        fields:
          - { label: "Název služby", name: "title", widget: "string" }
          - { label: "Cena", name: "price", widget: "number" }
          - { label: "Popis", name: "body", widget: "markdown" }