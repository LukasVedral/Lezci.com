backend:
  name: git-gateway
  branch: main

media_folder: "src/static/uploads"
public_folder: "/static/uploads"

collections:
  - name: "pages"
    label: "Stránky"
    folder: "content/pages"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titulek stránky (H1)", name: "title", widget: "string" }
      
      - label: "Typ obsahu / Šablona"
        name: "content"
        widget: "object"
        # Tady se děje to kouzlo:
        types:
          - label: "Standardní text"
            name: "default"
            fields:
              - { label: "Hlavní text", name: "body", widget: "markdown" }

          - label: "Kontaktní formulář"
            name: "contact"
            fields:
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Telefon", name: "phone", widget: "string" }
              - { label: "Jméno", name: "contact_name", widget: "string" }

          - label: "Detail služby"
            name: "service"
            fields:
              - { label: "Popis služby", name: "description", widget: "markdown" }
              - { label: "Cena", name: "price", widget: "string" }