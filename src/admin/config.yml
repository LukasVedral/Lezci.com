backend:
  name: git-gateway
  branch: main

media_folder: "src/static/uploads"
public_folder: "/static/uploads"

collections:
  - name: "pages"
    label: "Stránky"
    folder: "content/pages"
    create: true
    slug: "{{slug}}"
    fields:
          - label: "Šablona"
            name: "layout"
            widget: "select"
            options:
              - { label: "Standardní text", value: "default" }
              - { label: "Kontaktní formulář", value: "contact" }
            default: "default"

          - { label: "Titulek", name: "title", widget: "string" }

          # Skupina polí pro Text
          - label: "Obsah stránky"
            name: "default_fields"
            widget: "object"
            condition: { field: "layout", value: "default" }
            fields:
              - { label: "Hlavní text", name: "body", widget: "markdown" }

          # Skupina polí pro Kontakt
          - label: "Kontaktní údaje"
            name: "contact_fields"
            widget: "object"
            condition: { field: "layout", value: "contact" }
            fields:
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Telefon", name: "phone", widget: "string" }